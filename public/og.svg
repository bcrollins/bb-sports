<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06122A"/>
      <stop offset="1" stop-color="#0A1F44"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Network top + bottom rules -->
  <rect y="0" width="1200" height="14" fill="#D7263D"/>
  <rect y="616" width="1200" height="14" fill="#D7263D"/>

  <!-- Light angled stripes pattern -->
  <g opacity="0.05">
    <path d="M 0 0 L 1200 -200 L 1200 -180 L 0 20 Z" fill="#F5F2EC"/>
    <path d="M 0 50 L 1200 -150 L 1200 -130 L 0 70 Z" fill="#F5F2EC"/>
  </g>

  <!-- Eyebrow -->
  <text x="600" y="170" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="22" letter-spacing="9" fill="#D7263D">ISSUE 001 · BB SPORTS</text>

  <!-- Wordmark -->
  <text x="600" y="350" text-anchor="middle"
        font-family="Anton, Oswald, Inter, sans-serif" font-style="italic" font-weight="900"
        font-size="200" fill="#F5F2EC" letter-spacing="-6">BB SPORTS</text>

  <!-- Tagline -->
  <text x="600" y="430" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="34" fill="#F5F2EC" opacity="0.92">Sports from the fan's view.</text>
  <text x="600" y="490" text-anchor="middle" font-family="Anton, Oswald, Inter, sans-serif" font-style="italic" font-weight="900" font-size="64" fill="#D7263D" letter-spacing="-1">NO BULLSHIT.</text>

  <!-- Coverage strip -->
  <text x="600" y="565" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="20" letter-spacing="9" fill="#F5F2EC" opacity="0.7">NFL · NHL · CFB · SOCCER · NBA · MMA</text>
</svg>
